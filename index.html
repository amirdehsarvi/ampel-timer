<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ampel">
<link rel="apple-touch-icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Ampel-Abenteuer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one screen. Portrait: who/theme, four timer tabs, the timer picture, status, time, racer track, big button.
   Landscape (iPad/iPhone sideways): the picture on the left, everything else on the right.
   Single bright look on purpose; each theme sets its own colours and its own timer picture
   (face traffic light, hourglass, water jar or pie clock). Green/amber/red always mean the same thing. */
:root{
  --bg1:#fff3e0; --bg2:#ffd6a5;
  --housing:#2b2d42; --accent:#e63946;
  --ink:#231a3a; --muted:#5b5470;
  --card:rgba(255,255,255,.72);
  --green:#3ddc84; --amber:#ffc233; --red:#ff5a4e;
  --zone:#3ddc84;
  --glow:rgba(61,220,132,0);
  --lamp:min(9vh, 22vw);
  --font:'Baloo 2', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@supports (height:1dvh){ :root{ --lamp:min(9dvh, 22vw); } }
html,body{height:100%}
body{
  margin:0;
  background:linear-gradient(170deg, var(--bg1), var(--bg2));
  background-color:var(--bg1);
  color:var(--ink);
  font-family:var(--font);
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
.app{
  position:relative; z-index:1;
  min-height:100%;
  box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  background:radial-gradient(ellipse 70% 45% at 50% 42%, var(--glow), transparent 70%);
  transition:background .6s;
}
.panel{display:contents}
.top{order:1; width:100%; max-width:560px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
.modes{order:2; width:100%; max-width:560px; display:grid; grid-template-columns:repeat(4, 1fr); gap:6px}
.stage{order:3; display:flex; flex-direction:column; align-items:center}
.status{order:4; margin:0; font-size:clamp(17px, 4.4vw, 26px); font-weight:700; text-align:center; min-height:1.3em; text-wrap:balance; max-width:560px}
.time{order:5; font-size:clamp(50px, 14vw, 112px); font-weight:800; line-height:.95; font-variant-numeric:tabular-nums; letter-spacing:.02em}
.track{order:6}
.controls{order:7; width:100%; max-width:560px; display:flex; gap:10px}

button{font:inherit; color:inherit; border:0; cursor:pointer; touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
button:disabled{opacity:.4; cursor:default}

.who{display:flex; gap:6px}
.chip{background:var(--card); border-radius:999px; padding:6px 14px 4px; font-size:18px; font-weight:700; box-shadow:0 2px 0 rgba(0,0,0,.08)}
.chip[aria-pressed="true"]{background:var(--housing); color:#fff}
.chip .count{font-weight:600; opacity:.85}
.team{background:var(--housing); color:#fff}
.bday[hidden]{display:none}
.bday{order:1; width:100%; max-width:560px; box-sizing:border-box; text-align:center;
  background:linear-gradient(90deg, #f43f5e, #f59e0b, #22c55e, #3b82f6, #a855f7); color:#fff;
  border-radius:16px; padding:8px 12px 5px; font-size:clamp(18px, 5vw, 26px); font-weight:800;
  text-shadow:0 2px 0 rgba(0,0,0,.25); animation:bob 2.4s ease-in-out infinite}
.team.pop{animation:pop .7s cubic-bezier(.3,1.7,.5,1)}

.mode{
  background:var(--card); border-radius:16px; padding:6px 2px 4px; line-height:1.05;
  display:flex; flex-direction:column; align-items:center; gap:1px;
  box-shadow:0 3px 0 rgba(0,0,0,.08);
}
.mode .em{font-size:clamp(22px, 6vw, 30px); line-height:1.1}
.mode .lbl{font-size:clamp(13px, 3.4vw, 17px); font-weight:800}
.mode small{font-size:clamp(11px, 3vw, 14px); font-weight:600; color:var(--muted)}
.mode[aria-selected="true"]{background:var(--housing); color:#fff}
.mode[aria-selected="true"] small{color:rgba(255,255,255,.8)}

.hat,.feet{font-size:calc(var(--lamp) * .42); line-height:1; height:calc(var(--lamp) * .5); display:flex; align-items:center; justify-content:center; gap:calc(var(--lamp) * .35)}
.hat{margin-bottom:-4px; animation:bob 3s ease-in-out infinite}
.feet{margin-top:-2px}

/* ---- picture 1: face traffic light ---- */
.vis{position:relative; display:none; transform-origin:50% 100%}
.vis.show{display:block}
.vis.hurry{animation:wiggle 1.4s ease-in-out infinite}
.light{
  background:var(--housing);
  border-radius:calc(var(--lamp) * .45);
  padding:calc(var(--lamp) * .12);
  display:flex; flex-direction:column; gap:calc(var(--lamp) * .1);
  box-shadow:0 10px 0 rgba(0,0,0,.18), 0 18px 34px rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.12);
}
.lamp{
  width:var(--lamp); height:var(--lamp); border-radius:50%;
  background:rgba(255,255,255,.13);
  display:grid; place-items:center;
  box-shadow:inset 0 5px 12px rgba(0,0,0,.35);
  transition:background-color .35s, box-shadow .35s;
}
.lamp.on.r,.light.party .lamp.r{background:var(--red); box-shadow:0 0 calc(var(--lamp) * .4) var(--red), inset 0 -6px 10px rgba(0,0,0,.15)}
.lamp.on.a,.light.party .lamp.a{background:var(--amber); box-shadow:0 0 calc(var(--lamp) * .4) var(--amber), inset 0 -6px 10px rgba(0,0,0,.15)}
.lamp.on.g,.light.party .lamp.g{background:var(--green); box-shadow:0 0 calc(var(--lamp) * .4) var(--green), inset 0 -6px 10px rgba(0,0,0,.15)}
.lamp.pop{animation:pop .7s cubic-bezier(.3,1.7,.5,1)}
.light.party .lamp{animation:jump .9s ease-in-out infinite}
.light.party .lamp.a{animation-delay:.15s}
.light.party .lamp.g{animation-delay:.3s}

/* faces (used on lamps and on the mood badge) */
.face{width:80%; height:80%; overflow:visible}
.face path,.face ellipse{fill:none; stroke:#2a1d3f; stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round}
.face .fill{fill:#2a1d3f; stroke:none}
.face .shine{fill:#fff; stroke:none}
.face .cheek{fill:rgba(255,92,128,.45); stroke:none}
.face .tongue{fill:#ff7b8a; stroke:none}
.face .drop{fill:#7cc8ff; stroke:none}
.face .asleep{opacity:.32}
.face .asleep path{stroke:#fff}
.face .awake,.face .happy{display:none}
.lamp.on .face .asleep{display:none}
.lamp.on .face .awake{display:inline}
.light.party .face .asleep,.light.party .face .awake{display:none}
.light.party .face .happy{display:inline}
.eyes{transform-box:fill-box; transform-origin:center; animation:blink 4.5s infinite}

/* mood badge for the other pictures */
.mood{
  position:absolute; width:calc(var(--lamp) * 1.05); height:calc(var(--lamp) * 1.05); border-radius:50%;
  right:calc(var(--lamp) * -.45); bottom:calc(var(--lamp) * .15);
  background:var(--zone); display:grid; place-items:center;
  box-shadow:0 0 calc(var(--lamp) * .35) var(--zone), 0 4px 0 rgba(0,0,0,.15);
  transition:background-color .35s, box-shadow .35s;
}
.mood .face{display:none}
.mood .face.cur{display:block}
.mood .face .asleep{display:none}
.mood .face .awake{display:inline}
.mood.party .face .awake{display:none}
.mood.party .face .happy{display:inline}
.mood.pop{animation:pop .7s cubic-bezier(.3,1.7,.5,1)}
.mood.party{animation:jump .9s ease-in-out infinite}

/* ---- picture 2: hourglass ---- */
.sandsvg,.glasssvg{width:calc(var(--lamp) * 2.2); height:calc(var(--lamp) * 3.6); display:block; overflow:visible}
.sand{fill:var(--zone); transition:fill .35s}
.frame{fill:var(--housing)}
.glassline{fill:rgba(255,255,255,.45); stroke:var(--housing); stroke-width:3.5}
.stream{stroke:var(--zone); stroke-width:3; stroke-dasharray:4 5; animation:pour .5s linear infinite}

/* ---- picture 3: water jar ---- */
.liquid{fill:var(--zone); opacity:.88; transition:fill .35s}
.wave{animation:wave 2.4s linear infinite}
.bubble{fill:rgba(255,255,255,.7); animation:rise 3s ease-in infinite}
.bubble:nth-child(2){animation-delay:1s}
.bubble:nth-child(3){animation-delay:2s}
.jar{fill:rgba(255,255,255,.35); stroke:var(--housing); stroke-width:4}
.lid{fill:var(--housing)}

/* ---- picture 4: pie clock ---- */
.vis.pie .mood{left:50%; top:50%; right:auto; bottom:auto; transform:translate(-50%, -50%); width:calc(var(--lamp) * 1.5); height:calc(var(--lamp) * 1.5)}
.vis.pie .mood.pop,.vis.pie .mood.party{animation:none}
.piesvg{width:calc(var(--lamp) * 3.5); height:calc(var(--lamp) * 3.5); display:block}
.pietrack{fill:none; stroke:rgba(255,255,255,.55); stroke-width:22}
.piearc{fill:none; stroke:var(--zone); stroke-width:22; transition:stroke-dashoffset .5s linear, stroke .35s}
.pierim{fill:none; stroke:var(--housing); stroke-width:5}
.tick{fill:var(--housing)}

.track{
  width:100%; max-width:560px; height:52px; position:relative;
  background:var(--card); border-radius:999px;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.06);
}
.track::before{content:""; position:absolute; left:28px; right:52px; top:50%; border-top:3px dashed rgba(35,26,58,.25)}
.runner{position:absolute; top:50%; left:6px; font-size:34px; line-height:1; transform:translateY(-55%); transition:left .5s linear}
.runner.flip{transform:translateY(-55%) scaleX(-1)}
.goal{position:absolute; right:10px; top:50%; transform:translateY(-55%); font-size:30px; line-height:1}

.go{
  flex:3; background:var(--accent); color:#fff; border-radius:22px;
  font-size:clamp(24px, 6.5vw, 32px); font-weight:800; padding:12px 0 8px;
  box-shadow:0 6px 0 rgba(0,0,0,.2);
}
.go:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.2)}
.go.running{background:var(--housing)}
.small{flex:1; background:var(--card); border-radius:22px; font-size:18px; font-weight:700; padding:10px 6px 6px; box-shadow:0 4px 0 rgba(0,0,0,.08)}
.small.armed{background:var(--amber)}

.deco{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.deco span{position:absolute; font-size:clamp(26px, 6vw, 44px); opacity:.5; animation:float 6s ease-in-out infinite}

.party-card[hidden]{display:none}
.party-card{
  position:fixed; inset:0; z-index:20; display:grid; place-items:center;
  background:rgba(35,26,58,.35);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.party-box{background:#fff; border-radius:28px; padding:24px 22px 20px; width:100%; max-width:420px; text-align:center; box-shadow:0 12px 0 rgba(0,0,0,.15)}
.party-emoji{font-size:72px; line-height:1}
.party-title{margin:8px 0 2px; font-size:30px; font-weight:800; line-height:1.1; text-wrap:balance}
.party-sub{margin:0 0 16px; font-size:19px; color:var(--muted)}
.party-box .go{width:100%; display:block; margin-bottom:10px}
.party-box .go[hidden]{display:none}
.party-box .small{width:100%; display:block}
.confetti{position:fixed; top:-50px; z-index:30; pointer-events:none; font-size:30px; animation:fall 2.8s linear forwards}

/* ---- finale: the theme's character bursts onto the screen ---- */
.finale[hidden]{display:none}
.finale{
  position:fixed; inset:0; z-index:25; display:grid; place-items:center; overflow:hidden; cursor:pointer;
  background-color:var(--bg2);
  background-image:radial-gradient(circle at 50% 45%, #fff 0%, var(--bg2) 45%, var(--accent) 100%);
}
.fin-rays{position:absolute; left:50%; top:45%; width:200vmax; height:200vmax; margin:-100vmax 0 0 -100vmax; opacity:.35; pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.9) 0deg 10deg, transparent 10deg 20deg);
  animation:spin 6s linear infinite}
.fin-hero{grid-area:1/1; font-size:min(58vw, 52vh); line-height:1; filter:drop-shadow(0 22px 30px rgba(0,0,0,.35)); will-change:transform}
.fin-word{
  grid-area:1/1; align-self:end; margin-bottom:10vh; text-align:center;
  font-size:clamp(40px, 11.5vw, 130px); font-weight:800; line-height:1; letter-spacing:.02em; padding:0 12px; max-width:100vw; box-sizing:border-box;
  color:#fff; -webkit-text-stroke:4px var(--ink); paint-order:stroke fill;
  text-shadow:0 7px 0 rgba(0,0,0,.25);
  animation:word .8s .7s both cubic-bezier(.3,1.7,.5,1);
}
.finale.roar .fin-hero{animation:roar 2.6s cubic-bezier(.2,.9,.2,1) both}
.finale.roar{animation:shake .45s 1.05s 3}
.finale.rise .fin-hero{animation:rise 2.6s ease-in both}
.finale.dash .fin-hero{animation:dash 2.4s cubic-bezier(.5,0,.3,1) both}
@keyframes roar{0%{transform:scale(.05) rotate(-12deg)}30%{transform:scale(1.1) rotate(5deg)}40%{transform:scale(.95) rotate(-4deg)}50%{transform:scale(1.3) rotate(3deg)}62%{transform:scale(1.15) rotate(-2deg)}100%{transform:scale(1.7) rotate(0)}}
@keyframes rise{0%{transform:translateY(85vh) scale(.6)}55%{transform:translateY(0) scale(1.1)}70%{transform:translateY(-4vh) scale(1.15)}100%{transform:translateY(-130vh) scale(1.3)}}
@keyframes dash{0%{transform:translateX(-130vw) scale(.8)}42%{transform:translateX(0) scale(1.1)}58%{transform:translateX(0) scale(1.15)}100%{transform:translateX(140vw) scale(.9)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-14px,7px)}40%{transform:translate(12px,-9px)}60%{transform:translate(-9px,-7px)}80%{transform:translate(9px,9px)}}
@keyframes word{0%{transform:scale(0) rotate(-14deg); opacity:0}100%{transform:scale(1) rotate(-4deg); opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-10%)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@keyframes pour{to{stroke-dashoffset:-9}}
@keyframes wave{to{transform:translateX(-40px)}}
@keyframes rise{0%{transform:translateY(0); opacity:0}15%{opacity:1}100%{transform:translateY(-90px); opacity:0}}

@media (orientation:landscape){
  :root{--lamp:min(18vh, 12vw)}
  @supports (height:1dvh){ :root{ --lamp:min(18dvh, 12vw); } }
  .app{flex-direction:row; justify-content:center; align-items:center; gap:clamp(24px, 6vw, 72px); min-height:100%}
  .stage{order:0}
  .panel{order:1; display:flex; flex-direction:column; align-items:center; gap:8px; width:min(540px, 54vw)}
  .time{font-size:clamp(50px, 10vw, 120px)}
}
@media (min-width:700px) and (orientation:portrait){
  :root{--lamp:min(11vh, 19vw)}
  @supports (height:1dvh){ :root{ --lamp:min(11dvh, 19vw); } }
  .chip{font-size:22px; padding:8px 18px 6px}
  .mode{padding:10px 4px 8px}
  .track{height:62px}
  .runner{font-size:44px}
  .goal{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
  .finale,.fin-hero,.fin-word,.fin-rays{animation:none !important}
  .eyes,.hat,.deco span,.vis.hurry,.light.party .lamp,.lamp.pop,.mood.pop,.mood.party,.stream,.wave,.bubble{animation:none}
  .runner,.piearc{transition:none}
}
</style>

<div class="deco" id="deco" aria-hidden="true"></div>

<main class="app">
  <section class="stage" aria-label="Timer-Bild">
    <div class="hat" id="hat" aria-hidden="true"></div>

    <div class="vis" id="vis-ampel">
      <div class="light" id="light">
        <div class="lamp r" id="lampR"></div>
        <div class="lamp a" id="lampA"></div>
        <div class="lamp g" id="lampG"></div>
      </div>
    </div>

    <div class="vis" id="vis-sand">
      <svg class="sandsvg" viewBox="0 0 120 200" aria-hidden="true">
        <defs>
          <clipPath id="clipTop"><path d="M24 22 C24 70 55 80 56 100 L64 100 C65 80 96 70 96 22 Z"/></clipPath>
          <clipPath id="clipBot"><path d="M56 100 C55 120 24 130 24 178 L96 178 C96 130 65 120 64 100 Z"/></clipPath>
        </defs>
        <path class="glassline" d="M24 22 C24 70 55 80 56 100 C55 120 24 130 24 178 L96 178 C96 130 65 120 64 100 C65 80 96 70 96 22 Z"/>
        <g clip-path="url(#clipTop)"><rect class="sand" id="sandTop" x="0" y="26" width="120" height="74"/></g>
        <g clip-path="url(#clipBot)"><rect class="sand" id="sandBot" x="0" y="178" width="120" height="0"/></g>
        <line class="stream" id="stream" x1="60" y1="100" x2="60" y2="176"/>
        <rect class="frame" x="8" y="8" width="104" height="16" rx="7"/>
        <rect class="frame" x="8" y="176" width="104" height="16" rx="7"/>
        <rect class="frame" x="12" y="22" width="7" height="156" rx="3"/>
        <rect class="frame" x="101" y="22" width="7" height="156" rx="3"/>
      </svg>
      <div class="mood" id="mood-sand"></div>
    </div>

    <div class="vis" id="vis-glass">
      <svg class="glasssvg" viewBox="0 0 120 200" aria-hidden="true">
        <defs><clipPath id="clipJar"><rect x="20" y="30" width="80" height="158" rx="22"/></clipPath></defs>
        <rect class="jar" x="20" y="30" width="80" height="158" rx="22"/>
        <g clip-path="url(#clipJar)">
          <g id="liquid" transform="translate(0 0)">
            <path class="liquid wave" d="M-40 40 Q-30 32 -20 40 T0 40 T20 40 T40 40 T60 40 T80 40 T100 40 T120 40 T140 40 T160 40 V260 H-40 Z"/>
            <g><circle class="bubble" cx="44" cy="180" r="4"/><circle class="bubble" cx="66" cy="184" r="3"/><circle class="bubble" cx="80" cy="182" r="5"/></g>
          </g>
        </g>
        <rect class="jar" x="20" y="30" width="80" height="158" rx="22" style="fill:none"/>
        <rect class="lid" x="28" y="16" width="64" height="18" rx="7"/>
      </svg>
      <div class="mood" id="mood-glass"></div>
    </div>

    <div class="vis pie" id="vis-pie">
      <svg class="piesvg" viewBox="0 0 120 120" aria-hidden="true">
        <g id="ticks"></g>
        <circle class="pietrack" cx="60" cy="60" r="44"/>
        <circle class="piearc" id="arc" cx="60" cy="60" r="44" transform="rotate(-90 60 60)" stroke-dasharray="276.46" stroke-dashoffset="0"/>
        <circle class="pierim" cx="60" cy="60" r="56"/>
      </svg>
      <div class="mood" id="mood-pie"></div>
    </div>

    <div class="feet" id="feet" aria-hidden="true"></div>
  </section>

  <div class="panel">
    <div class="top">
      <div class="chip team" id="team" aria-live="polite">⭐ Unsere Sterne: <span id="teamCount">0</span></div>
      <button type="button" class="chip" id="soundBtn" aria-label="Ton an oder aus">🔊</button>
      <button type="button" class="chip" id="themeBtn" aria-label="Anderes Thema">🎲 <span id="themeName"></span></button>
    </div>

    <div class="bday" id="bday" hidden></div>
    <div class="modes" id="modes" role="tablist" aria-label="Timer"></div>

    <p class="status" id="status" aria-live="polite"></p>
    <div class="time" id="time">20:00</div>

    <div class="track" aria-hidden="true">
      <span class="runner" id="runner"></span>
      <span class="goal" id="goal"></span>
    </div>

    <div class="controls">
      <button type="button" class="go" id="go">Start ▶</button>
      <button type="button" class="small" id="reset">Neu</button>
    </div>
  </div>
</main>

<div class="finale" id="finale" hidden aria-hidden="true">
  <div class="fin-rays"></div>
  <div class="fin-hero" id="finHero"></div>
  <div class="fin-word" id="finWord"></div>
</div>

<div class="party-card" id="party" hidden>
  <div class="party-box" role="dialog" aria-modal="true" aria-labelledby="partyTitle">
    <div class="party-emoji" id="partyEmoji">🎉</div>
    <p class="party-title" id="partyTitle"></p>
    <p class="party-sub" id="partySub"></p>
    <button type="button" class="go" id="partyNext"></button>
    <button type="button" class="small" id="partyClose">Schließen</button>
  </div>
</div>

<script>
// ---------- themes: colours, the timer picture, hat and feet, the racer and its goal ----------
const THEMES = [

function render() {

// ---------- timer engine ----------
function tickAll() {
  const t = timers[mode];
  if (!t.running) return;
  t.remaining = Math.max(0, t.endAt - Date.now());
  if (t.amb && t.amb.length && t.remaining > 0 && t.remaining <= t.amb[0]) { t.amb.shift(); playSfx(themeSounds(theme)[1]); }
  if (t.remaining <= 0) finish(mode);
  render();
}
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (_) {}
}
function letSleep() { try { if (wake) wake.release(); } catch (_) {} wake = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (timers[mode].running) keepAwake(); tickAll(); }
});

function start() {
  const t = timers[mode];
  if (t.done) { t.done = false; t.remaining = t.total; }
  t.endAt = Date.now() + t.remaining;
  t.running = true;
  audioUnlock();
  // two soft themed sounds at random moments while the timer runs
  t.amb = [0.55 + Math.random() * 0.25, 0.3 + Math.random() * 0.15].map(x => x * t.total).filter(ms => ms < t.remaining);
  keepAwake();
  clearInterval(tick); tick = setInterval(tickAll, 250);
  render();
}
function pause() {
  const t = timers[mode];
  t.remaining = Math.max(0, t.endAt - Date.now());
  t.running = false;
  clearInterval(tick); letSleep();
  render();
}
function resetTimer(which) {
  const t = timers[which];
  t.running = false; t.done = false; t.remaining = t.total;
  if (which === mode) { clearInterval(tick); letSleep(); }
}
function switchMode(next) {
  if (ORDER.some(k => timers[k].running && k !== next)) return;
  mode = next; lastZone = null;
  render();
}
function finish(which) {
  const t = timers[which];
  t.running = false; t.done = true; t.remaining = 0;
  clearInterval(tick); letSleep();
  if (MODES[which].star) { stars += 1; saveStars(); popEl($('team')); }
  celebrate(which);
}

// iPhone/iPad play sounds most reliably through one audio element that a tap has unlocked.
function wavBlob(samples, sr) {
  const n = samples.length, dv = new DataView(new ArrayBuffer(44 + n * 2));
  const w = (o, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  w(36, 'data'); dv.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const v = Math.max(-1, Math.min(1, samples[i])); dv.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true); }
  return new Blob([dv], { type:'audio/wav' });
}

const player = new Audio();

player.setAttribute('playsinline', '');
let unlocked = false;
const sfxUrls = {};
function renderSfx(name) {
  if (sfxUrls[name]) return sfxUrls[name];
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OAC || !SFX[name]) return Promise.resolve(null);
  const sr = 22050, oc = new OAC(1, Math.round(sr * 3.6), sr);
  const keep = [actx, master, noiseBuf];
  actx = oc; master = oc.createGain(); master.gain.value = 0.9; master.connect(oc.destination); noiseBuf = null;
  try { SFX[name](0.02); } catch (e) { actx = keep[0]; master = keep[1]; noiseBuf = keep[2]; return Promise.resolve(null); }
  actx = keep[0]; master = keep[1]; noiseBuf = keep[2];
  sfxUrls[name] = new Promise(res => {
    const done = buf => res(URL.createObjectURL(wavBlob(buf.getChannelData(0), sr)));
    oc.oncomplete = e => done(e.renderedBuffer);
    const r = oc.startRendering();
    if (r && r.then) r.then(done).catch(() => res(null));
  });
  return sfxUrls[name];
}
function prepareThemeSounds() {
  themeSounds(theme).concat(['ding', 'hurry']).forEach(renderSfx);
  const f = theme.fin; if (f && f.variants) f.variants.forEach(v => { if (v.sfx) renderSfx(v.sfx); });
}
function audioUnlock() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
  if (!unlocked) {
    unlocked = true;
    try { player.src = SILENT_URL; const pr = player.play(); if (pr && pr.catch) pr.catch(() => { unlocked = false; }); } catch (_) { unlocked = false; }
    try { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (_) {}
  }
  prepareThemeSounds();
}
function envelope(g, t, a, d, v) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function osc(type, f0, f1, t, dur, vol, vib) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  if (vib) {
    const l = actx.createOscillator(), lg = actx.createGain();
    l.frequency.value = vib[0]; lg.gain.value = vib[1];
    l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur + 0.1);
  }
  envelope(g, t, Math.min(0.05, dur / 4), dur, vol);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.15);
}
function noise(t, dur, vol, f0, f1, q) {
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf; src.loop = true;
  f.type = 'bandpass'; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  envelope(g, t, Math.min(0.06, dur / 4), dur, vol);
  src.connect(f).connect(g).connect(master); src.start(t); src.stop(t + dur + 0.15);
}
const hz = n => 440 * Math.pow(2, (n - 69) / 12);
function melody(type, notes, step, t, vol, len) {
  notes.forEach((n, i) => { if (n) osc(type, hz(n), hz(n), t + i * step, len || step * 0.9, vol); });
}
const SFX = {
  // finales
  roar:      t => { noise(t, 1.8, 0.9, 400, 120, 0.8); osc('sawtooth', 120, 60, t, 1.8, 0.35, [22, 18]); },
  kraken:    t => { noise(t, 2.0, 0.8, 220, 80, 0.7); osc('sawtooth', 80, 45, t, 2.0, 0.35, [9, 12]); },
  dragon:    t => { noise(t, 1.6, 0.9, 2500, 300, 0.6); osc('sawtooth', 150, 70, t + 0.1, 1.4, 0.3, [25, 20]); },
  chomp:     t => { [0, 0.35].forEach(d => { noise(t + d, 0.25, 0.9, 900, 200, 1); osc('square', 160, 50, t + d, 0.2, 0.4); }); },
  engine:    t => { osc('sawtooth', 55, 220, t, 1.6, 0.35, [28, 25]); noise(t, 1.6, 0.25, 300, 900, 0.8); },
  whoosh:    t => { noise(t, 2.0, 0.9, 150, 4000, 0.7); osc('sine', 80, 40, t, 2.0, 0.3); },
  goal:      t => { osc('sine', 2200, 2200, t, 0.25, 0.25, [30, 120]); osc('sine', 2200, 2200, t + 0.35, 0.6, 0.25, [30, 120]); noise(t + 1.0, 1.8, 0.6, 700, 1100, 0.4); },
  trumpet:   t => { osc('sawtooth', 330, 660, t, 0.9, 0.35, [7, 25]); osc('sawtooth', 660, 500, t + 0.9, 0.6, 0.3, [7, 25]); },
  magic:     t => melody('sine', [84, 88, 91, 96, 100, 103], 0.09, t, 0.25, 0.5),
  bells:     t => { [76, 79, 84, 79, 76].forEach((n, i) => { osc('sine', hz(n), hz(n), t + i * 0.28, 1.2, 0.25); osc('sine', hz(n) * 2.76, hz(n) * 2.76, t + i * 0.28, 0.6, 0.06); }); },
  boom:      t => { noise(t, 1.2, 0.9, 120, 40, 0.5); osc('sine', 90, 30, t, 1.0, 0.5); for (let i = 0; i < 10; i++) noise(t + 0.5 + Math.random() * 1.2, 0.05, 0.4, 3000, 3000, 2); },
  partyhorn: t => osc('sawtooth', 420, 520, t, 0.9, 0.3, [12, 15]),
  boing:     t => { [0, 0.3, 0.6].forEach(d => osc('sine', 180, 700, t + d, 0.25, 0.4)); },
  fanfare:   t => melody('square', [67, 72, 76, 79, 0, 76, 79], 0.14, t, 0.18),
  ghost:     t => { osc('sine', 300, 520, t, 0.9, 0.35, [6, 25]); osc('sine', 520, 260, t + 0.9, 1.0, 0.35, [6, 25]); },
  muahaha:   t => { [0, 0.32, 0.64, 0.96].forEach((d, i) => osc('sawtooth', 160 - i * 12, 120 - i * 12, t + d, 0.26, 0.3, [14, 12])); },
  cackle:    t => { for (let i = 0; i < 6; i++) osc('square', 900 - i * 60, 700 - i * 60, t + i * 0.16, 0.12, 0.2); },
  meow:      t => { osc('triangle', 520, 900, t, 0.3, 0.35); osc('triangle', 900, 420, t + 0.3, 0.55, 0.35); },
  spooky:    t => melody('triangle', [57, 60, 63, 66, 69, 66], 0.18, t, 0.25, 0.3),
  // soft sounds for the middle of a timer
  birds:     t => { for (let i = 0; i < 3; i++) osc('sine', 2800, 3600, t + i * 0.22, 0.12, 0.12); },
  bubbles:   t => { for (let i = 0; i < 5; i++) osc('sine', 300 + Math.random() * 400, 900, t + i * 0.15, 0.1, 0.15); },
  beeps:     t => melody('square', [84, 79, 88, 0, 91], 0.12, t, 0.08),
  stomp:     t => { [0, 0.55].forEach(d => { osc('sine', 70, 35, t + d, 0.35, 0.5); noise(t + d, 0.2, 0.3, 200, 80, 0.7); }); },
  shipbell:  t => { [0, 0.45].forEach(d => { osc('sine', 880, 880, t + d, 1.0, 0.18); osc('sine', 2430, 2430, t + d, 0.5, 0.05); }); },
  crowd:     t => noise(t, 1.6, 0.35, 800, 1000, 0.4),
  drumroll:  t => { for (let i = 0; i < 14; i++) noise(t + i * 0.06, 0.05, 0.3, 1500, 1500, 1); noise(t + 0.9, 0.4, 0.5, 5000, 5000, 0.5); },
  crackle:   t => { for (let i = 0; i < 12; i++) noise(t + Math.random() * 1.2, 0.04, 0.3, 4000, 4000, 2); },
  owl:       t => { osc('sine', 420, 400, t, 0.35, 0.25); osc('sine', 420, 380, t + 0.5, 0.6, 0.25); },
  // traffic-light changes
  ding:      t => { osc('sine', 880, 880, t, 0.5, 0.25); osc('sine', 660, 660, t + 0.25, 0.7, 0.25); },
  hurry:     t => melody('sine', [76, 79, 83], 0.12, t, 0.25),
};
// [finale sound, sound for the middle of the timer] per theme
const SOUNDS = {
  'Rennstrecke':['engine','engine'], 'Weltraum':['whoosh','beeps'], 'Dschungel':['roar','birds'],
  'Unterwasser':['chomp','bubbles'], 'Dinoland':['roar','stomp'], 'Piratenschiff':['kraken','shipbell'],
  'Einhornland':['magic','magic'], 'Fußballstadion':['goal','crowd'], 'Zirkus':['trumpet','drumroll'],
  'Zauberlabor':['dragon','magic'], 'Halloween':['spooky','owl'], 'Sankt Martin':['magic','bells'],
  'Weihnachten':['bells','bells'], 'Silvester':['boom','crackle'], 'Fasching':['partyhorn','partyhorn'],
  'Ostern':['boing','birds'],
};
function themeSounds(t) {
  if (t.name.indexOf('Geburtstag') === 0) return ['fanfare', 'partyhorn'];
  return SOUNDS[t.name] || ['fanfare', 'magic'];
}
function playSfx(name) {
  if (!soundOn || !name || !SFX[name]) return;
  renderSfx(name).then(url => {
    if (!url || !soundOn) return;
    try { player.src = url; const pr = player.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (_) {}
  });
}
function speak(text) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.rate = 0.95; u.pitch = 1.1;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /anna/i.test(x.name) && /^de/i.test(x.lang)) || vs.find(x => /^de/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (_) {}
}
function updateSoundBtn() { $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; }

// ---------- celebration ----------
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const pool = theme.deco.concat(['⭐', '🎉', '✨', MODES[mode].em]);
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'confetti';
    d.textContent = pool[i % pool.length];
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 4000);
  }
}
function finale(done) {
  const f = theme.fin, el = $('finale');
  // some themes have several finales and pick one at random each time
  const pick = f.variants ? f.variants[Math.floor(Math.random() * f.variants.length)] : f;
  $('finHero').innerHTML = '<span style="display:inline-block' + (pick.flip ? ';transform:scaleX(-1)' : '') + '">' + pick.hero + '</span>';
  $('finWord').textContent = pick.word;
  el.className = 'finale ' + f.anim;
  el.hidden = false;
  playSfx(pick.sfx || themeSounds(theme)[0]);
  let closed = false;
  const close = () => { if (closed) return; closed = true; el.hidden = true; done(); };
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(close, reduce ? 1500 : 2900);
  el.onclick = close;   // a tap skips straight to the celebration
}
function celebrate(which) { finale(() => showParty(which)); }
function showParty(which) {
  const m = MODES[which];
  confetti();
  $('partyEmoji').textContent = which === 'hw' ? theme.goal + ' 🎉' : m.party;
  $('partyTitle').textContent = m.title;
  $('partySub').textContent = m.star
    ? 'Ein Stern für euch beide ⭐ Zusammen habt ihr jetzt ' + stars + '!'
    : 'Zurück an die Aufgaben. Ihr schafft das!';
  const nb = $('partyNext');
  if (m.next) {
    const n = MODES[m.next];
    nb.hidden = false;
    nb.textContent = n.lbl + ' starten ' + n.em + ' ' + n.min + ' Min';
    nb.onclick = () => { $('party').hidden = true; resetTimer(m.next); switchMode(m.next); start(); };
  } else {
    nb.hidden = true;
    nb.onclick = null;
  }
  $('party').hidden = false;
  speak(m.title + (m.star ? ' Ein Stern für euch!' : ''));
}
$('partyClose').onclick = () => { $('party').hidden = true; };

// ---------- buttons ----------
$('go').onclick = () => { timers[mode].running ? pause() : start(); };
ORDER.forEach(k => { $('m-' + k).onclick = () => switchMode(k); });
$('themeBtn').onclick = () => { randomTheme(); render(); };
// "Neu" needs two taps, so a child cannot restart the timer by accident.
$('reset').onclick = () => {
  const b = $('reset');
  if (!resetArmed) {
    b.textContent = 'Nochmal?'; b.classList.add('armed');
    resetArmed = setTimeout(() => { resetArmed = null; b.textContent = 'Neu'; b.classList.remove('armed'); }, 3000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null;
  b.textContent = 'Neu'; b.classList.remove('armed');
  resetTimer(mode); lastZone = null; render();
};

$('soundBtn').onclick = () => {
  soundOn = !soundOn;
  try { localStorage.setItem('ampelSound', soundOn ? 'on' : 'off'); } catch (_) {}
  updateSoundBtn();
  if (soundOn) { audioUnlock(); playSfx('ding'); } else if ('speechSynthesis' in window) speechSynthesis.cancel();
};
updateSoundBtn();
randomTheme();
(function () {
  const now = new Date();
  const today = String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const kids = BIRTHDAYS.filter(b => b.day === today).map(b => b.name);
  if (kids.length) { $('bday').textContent = '🎂 Heute hat ' + kids.join(' und ') + ' Geburtstag! 🎉'; $('bday').hidden = false; }
})();
render();
</script>
